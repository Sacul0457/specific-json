[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specific_json"
version = "0.1.3"
description = "A JSON serialisation libary implemented in C"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["specific_json"]
include-package-data = true

[tool.setuptools.package-data]
specific_json = ["*.pyi", "py.typed"]